<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Follies d'Après-Midi — Épicée. Libre.</title>
    <meta name="description" content="Follies d'Après-Midi — luxury prêt-à-porter, designed and produced in limited quantities in Lebanon. Épicée. Libre." />
    <meta name="theme-color" content="#0C0B0A" />

    <!-- The house's monogram, the way it is cut on the lift doors. -->
    <link rel="icon" href="/brand/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/icon-512.png" sizes="512x512" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- What is true wherever the shop is served from. The canonical, the
         share picture and the rest are written per page by the Worker, off
         the address it is actually answering on. -->
    <meta property="og:site_name" content="Follies d'Après-Midi" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="The campaign film: a figure at a table in open country." />
    <!-- The house's own faces, served from the shop: Giaza sets the display,
         Bodoni the wordmark and the small caps. Inter is left to the running
         text, where a didone is a chore to read on a screen. -->
    <link rel="preload" href="/fonts/Giaza.otf" as="font" type="font/otf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
